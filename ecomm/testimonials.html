<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Testimonials — Prakriti Ayurveda</title>
  <meta name="description" content="Read what customers say about Prakriti Ayurveda products.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="testimonials">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Testimonials</p>
        <h1>Stories from our customers</h1>
        <p class="lead">Experiences from people who have made Ayurveda part of their daily routine.</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="rating-summary">
          <div class="rating-summary__score">
            <strong id="avgRating">–</strong>
            <span id="avgStars"></span>
            <span class="muted small" id="reviewCount"></span>
          </div>
          <div class="rating-summary__bars" id="ratingBars"></div>
        </div>
        <div class="review-grid" id="reviewGrid"></div>
      </div>
    </section>

    <section class="section section--tint">
      <div class="container cta-band">
        <div>
          <h2 class="section__title">Share your experience</h2>
          <p class="muted">Used one of our products? We'd love to hear how it worked for you.</p>
        </div>
        <a href="contact.html" class="btn btn--primary">Write to us</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/testimonials.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
